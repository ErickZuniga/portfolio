<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .bg { fill: #0a0c10; rx: 20; ry: 20; }
      .text { 
        fill: #43b0b6; 
        font-family: 'Cinzel', serif; 
        font-size: 60px; 
        font-weight: 800; 
        text-anchor: middle; 
        dominant-baseline: central;
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #43b0b6; }
        .text { fill: #ffffff; }
      }
    </style>
  </defs>
  <rect class="bg" width="100" height="100" />
  <text class="text" x="50" y="55">EZ</text>
</svg>
